<path d="M1800 590 L1660 560 1530 650 1410 710 1320 900 1800 900Z" fill="#050c0d"/>

<!-- Left raven -->
<g transform="translate(165 458)">
  <path d="M0 155 C-30 80 16 28 92 25 C125 24 166 39 190 74 C150 78 123 100 103 132 C75 168 36 178 0 155Z" fill="#020405" stroke="#94c9c2" stroke-opacity=".38" stroke-width="3"/>

  <text x="1692" y="110">ᚱ</text><text x="1692" y="180">ᚲ</text><text x="1692" y="250">ᚷ</text><text x="1692" y="320">ᚹ</text>
</g>

<!-- Low fog -->
<path d="M0 610 C300 540 560 650 820 590 S1330 550 1800 620 L1800 740 C1380 650 1160 700 820 665 S320 680 0 735Z" fill="#d8f7ee" fill-opacity=".045" filter="url(#blur24)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#04080b"/><stop offset=".48" stop-color="#0a1719"/><stop offset="1" stop-color="#020607"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#203330"/><stop offset="1" stop-color="#050b0c"/></linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263a38"/><stop offset="1" stop-color="#061011"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#573525"/><stop offset=".48" stop-color="#d28d62"/><stop offset="1" stop-color="#4b2b1e"/></linearGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63d8d5"/><stop offset=".5" stop-color="#d8f7ee"/><stop offset="1" stop-color="#63d8d5"/></linearGradient>
  <radialGradient id="aurora"><stop stop-color="#81efe1" stop-opacity=".42"/><stop offset="1" stop-color="#81efe1" stop-opacity="0"/></radialGradient>
  <radialGradient id="moon"><stop stop-color="#eef7f0"/><stop offset=".7" stop-color="#bcc8c6"/><stop offset="1" stop-color="#71807d"/></radialGradient>
  <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="knot" width="96" height="48" patternUnits="userSpaceOnUse">
    <path d="M0 24C18 0 30 0 48 24S78 48 96 24" fill="none" stroke="#8fe6e4" stroke-opacity=".12" stroke-width="3"/>
    <path d="M0 24C18 48 30 48 48 24S78 0 96 24" fill="none" stroke="#d28d62" stroke-opacity=".10" stroke-width="3"/>
  </pattern>
</defs>

<rect width="1800" height="900" fill="url(#sky)"/>

<!-- Stars -->
<g fill="#dbeeea" opacity=".55">
  <circle cx="110" cy="90" r="1.7"/><circle cx="220" cy="160" r="1.2"/><circle cx="328" cy="72" r="1.5"/>
  <circle cx="520" cy="122" r="1.3"/><circle cx="720" cy="65" r="1.4"/><circle cx="930" cy="136" r="1.1"/>
  <circle cx="1118" cy="77" r="1.5"/><circle cx="1360" cy="142" r="1.2"/><circle cx="1560" cy="75" r="1.8"/>
  <circle cx="1710" cy="158" r="1.1"/>
</g>

<!-- Moon -->
<circle cx="1518" cy="145" r="78" fill="url(#moon)" opacity=".95"/>
<circle cx="1492" cy="123" r="14" fill="#92a19f" opacity=".18"/>
<circle cx="1547" cy="167" r="11" fill="#8c9b99" opacity=".14"/>
<circle cx="1526" cy="108" r="7" fill="#7f8f8b" opacity=".14"/>


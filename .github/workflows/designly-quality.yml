name: Designly Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Parse Editor TSX
        run: npx esbuild src/components/EditorPage.tsx --loader:.tsx=tsx --outfile=/tmp/editor.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

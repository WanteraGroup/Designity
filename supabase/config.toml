# Designity supabase config
#
# v2 exposes two functions, both JWT-verified. Wave 1 shipped twelve, several
# with verify_jwt = false; the public ones are gone rather than carried over.

project_id = "your-project-ref"

[functions.designly-agent]
verify_jwt = true
entrypoint = "./functions/designly-agent/index.ts"

[functions.designly-editor-ai]
verify_jwt = true
entrypoint = "./functions/designly-editor-ai/index.ts"
